# Cấu hình dùng chung cho mọi job (spark-client, Airflow).
spark.master                                   spark://spark-master:7077

# Delta Lake + Apache Sedona
spark.sql.extensions                           io.delta.sql.DeltaSparkSessionExtension,org.apache.sedona.sql.SedonaSqlExtensions
spark.sql.catalog.spark_catalog                org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.serializer                               org.apache.spark.serializer.KryoSerializer
spark.kryo.registrator                         org.apache.sedona.core.serde.SedonaKryoRegistrator

# MinIO qua S3A (thông tin đăng nhập lấy từ biến môi trường AWS_*)
spark.hadoop.fs.s3a.endpoint                   http://minio:9000
spark.hadoop.fs.s3a.path.style.access          true
spark.hadoop.fs.s3a.connection.ssl.enabled     false
spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider   com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.fast.upload                true

# Quy ước nhóm: ghi đè đúng partition ngày đang chạy, giờ Việt Nam
spark.sql.sources.partitionOverwriteMode       dynamic
spark.sql.session.timeZone                     Asia/Ho_Chi_Minh

# Mặc định vừa phải cho máy cá nhân, job có thể ghi đè bằng --conf
spark.driver.memory                            2g
spark.executor.memory                          2g
spark.sql.shuffle.partitions                   64
spark.sql.adaptive.enabled                     true
