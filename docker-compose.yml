# Hạ tầng đồ án GPS xe tải
# Chạy từ thư mục infra/:  docker compose --profile <tên> up -d
#   (không profile) : MinIO + Spark            -> lõi, luôn bật
#   streaming       : Kafka + Kafka UI
#   serving         : Elasticsearch + Kibana
#   orchestration   : Airflow + PostgreSQL metadata
name: gps

x-spark-common: &spark-common
  image: gps/spark:3.5.3
  pull_policy: never
  env_file: .env
  volumes:
    - ./conf/spark-defaults.conf:/opt/spark-conf/spark-defaults.conf:ro
    - ./scripts:/opt/infra/scripts:ro
    - ../jobs:/opt/jobs
    - ../data:/data
  restart: unless-stopped

x-airflow-common: &airflow-common
  image: gps/airflow:2.10.3
  pull_policy: never
  env_file: .env
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    SPARK_CONF_DIR: /opt/spark-conf
  volumes:
    - ./conf/spark-defaults.conf:/opt/spark-conf/spark-defaults.conf:ro
    - ./scripts:/opt/infra/scripts:ro
    - ../dags:/opt/airflow/dags
    - ../jobs:/opt/jobs
    - ../data:/data
    - airflow-logs:/opt/airflow/logs
  profiles: [orchestration]

services:
  # ---------------------------------------------------------------- Lưu trữ
  minio:
    image: cgr.dev/chainguard/minio:latest   # MinIO không còn image chính thức, xem README
    user: "0:0"                              # tránh lỗi quyền ghi volume (chỉ dùng cho môi trường dev)
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    mem_limit: 1g
    restart: unless-stopped

  minio-init:
    <<: *spark-common
    command: ["python3", "/opt/infra/scripts/init_minio.py"]
    depends_on: [minio]
    restart: "no"

  # ---------------------------------------------------------------- Spark
  spark-master:
    <<: *spark-common
    build:
      context: ./docker
      dockerfile: spark/Dockerfile
    hostname: spark-master
    command: ["spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"
    mem_limit: 1g

  spark-worker:       # nhân bản: docker compose up -d --scale spark-worker=2
    <<: *spark-common
    command: ["bash", "-c",
              "exec spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores $${SPARK_WORKER_CORES} --memory $${SPARK_WORKER_MEMORY}"]
    depends_on: [spark-master]
    mem_limit: ${SPARK_WORKER_CONTAINER_MEM:-4g}

  spark-client:       # nơi chạy spark-submit / pyspark bằng tay
    <<: *spark-common
    hostname: spark-client
    environment:
      SPARK_LOCAL_HOSTNAME: spark-client
    command: ["sleep", "infinity"]
    depends_on: [spark-master]
    ports:
      - "4040:4040"   # Spark application UI
    mem_limit: 3g

  # ---------------------------------------------------------------- Kafka
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    user: "0:0"       # tránh lỗi quyền ghi volume (chỉ dùng cho môi trường dev)
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: "72"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "29092:29092"  # truy cập từ máy host: localhost:29092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped
    profiles: [streaming]

  kafka-init:
    image: apache/kafka:3.9.0
    env_file: .env
    entrypoint: ["/bin/sh", "/opt/infra/scripts/create_topics.sh"]
    volumes:
      - ./scripts:/opt/infra/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    profiles: [streaming]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: gps
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8082:8080"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    profiles: [streaming]

  # ---------------------------------------------------------------- Phục vụ
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # chỉ dùng cho môi trường dev
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped
    profiles: [serving]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    profiles: [serving]

  # ---------------------------------------------------------------- Airflow
  airflow-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
    profiles: [orchestration]

  airflow-init:
    <<: *airflow-common
    build:
      context: ./docker
      dockerfile: airflow/Dockerfile
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        (airflow users create --role Admin
        --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname GPS --lastname Admin --email admin@example.com || true)
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8088:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 1500m
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler   # executor Spark kết nối ngược về driver theo tên này
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    mem_limit: 3g
    restart: unless-stopped

volumes:
  minio-data:
  kafka-data:
  es-data:
  airflow-db-data:
  airflow-logs:
